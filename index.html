<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0e14" />
    <title>Perok</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="status" id="status">
      <button id="connect" class="connect" type="button">Connect</button>
      <span class="chip" id="flight" aria-live="polite">offline</span>
      <span class="chip" id="battery" aria-live="polite">battery —</span>
      <span class="chip notice" id="notice" aria-live="polite" hidden></span>
      <button id="settings-open" class="icon-btn" type="button">⚙</button>
    </header>

    <main class="pad">
      <section class="stick" id="stick-left">
        <span class="stick-hint" data-i18n="stickLeftHint">movement</span>
        <span class="knob" data-knob></span>
      </section>

      <section class="center">
        <div class="actions">
          <button id="takeoff" class="action" type="button" disabled data-i18n="takeOff">
            Take off
          </button>
          <button id="land" class="action land" type="button" disabled data-i18n="land">
            Land
          </button>
        </div>

        <div class="actions-grid">
          <button
            id="flattrim"
            class="action compact"
            type="button"
            disabled
            data-i18n="flatTrim"
          >
            Flat trim
          </button>
          <button id="flip" class="action compact" type="button" disabled data-i18n="flip">
            Flip
          </button>
          <button
            id="photo"
            class="action compact"
            type="button"
            disabled
            data-i18n="photo"
          >
            Photo
          </button>
        </div>

        <div class="cutoff" id="cutoff" role="button">
          <span class="cutoff-label" data-i18n="cutoffLabel">Slide to cut the motors</span>
          <span class="cutoff-handle" data-handle></span>
        </div>
      </section>

      <section class="stick" id="stick-right">
        <span class="stick-hint" data-i18n="stickRightHint">altitude · heading</span>
        <span class="knob" data-knob></span>
      </section>
    </main>

    <!-- Settings. One row today; built so the P2 flight limits slot in beside it. -->
    <div class="panel" id="settings" hidden>
      <div
        class="panel-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <div class="panel-head">
          <h2 id="settings-title" data-i18n="settings">Settings</h2>
          <button id="settings-close" class="icon-btn" type="button">✕</button>
        </div>

        <div class="panel-row">
          <span class="panel-label" data-i18n="language">Language</span>
          <div class="choices" id="language-choices"></div>
        </div>

        <!-- One row per limit the drone reports; nothing is hardcoded. -->
        <div id="limit-rows"></div>

        <div class="panel-row" id="limits-unavailable">
          <span class="panel-label" data-i18n="limitsUnavailable">
            Flight limits available once the drone is connected.
          </span>
        </div>

        <!-- Appears only if the drone announces a light of its own. -->
        <div class="panel-row panel-row-stack" id="light-row" hidden>
          <span class="panel-label" data-i18n="lights">Lights</span>
          <div class="choices" id="light-choices"></div>
          <label class="slider">
            <span data-i18n="intensity">Intensity</span>
            <input type="range" id="light-intensity" min="0" max="100" value="100" />
          </label>
        </div>

        <div class="panel-row" id="update-row" hidden>
          <span class="panel-label" id="update-label" data-i18n="updateAvailable">
            Update available
          </span>
          <button id="update-apply" class="choice" type="button" data-i18n="applyUpdate">
            Apply
          </button>
        </div>

        <!-- Notifications in, writes out, last/worst write latency. Enough to
             tell a congested link from a slow interface. -->
        <div class="panel-row">
          <span class="panel-label" data-i18n="diagnostics">Link</span>
          <span class="panel-value" id="diagnostics-value">—</span>
        </div>

        <div class="panel-row">
          <span class="panel-label" data-i18n="version">Version</span>
          <span class="panel-value" id="version-value">—</span>
        </div>
      </div>
    </div>

    <script type="module" src="dist/ui/app.js"></script>
    <script>
      // Relative path: the scope must follow the GitHub Pages sub-path.
      // `updateViaCache: 'none'` keeps the HTTP cache out of the way, so an
      // update check always sees the worker that is actually deployed.
      // Registration stays inline so the offline shell survives even if the
      // module graph fails to load; src/ui/updates.ts drives the checks.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('sw.js', { updateViaCache: 'none' })
            .catch((error) => {
              console.error('Service worker not registered', error);
            });
        });
      }
    </script>
  </body>
</html>
