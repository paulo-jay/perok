name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The suite must pass before anything ships: byte and sign errors are
      # invisible anywhere other than in flight.
      - run: npm test

      - run: npm run build

      - name: Assemble the site
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          mkdir -p site/dist
          cp index.html manifest.webmanifest site/
          cp -r css icons site/
          # The cache name must change on every build, otherwise the browser
          # sees no service worker update and installed phones keep serving the
          # first shell they cached.
          sed "s/__BUILD_ID__/${BUILD_ID}/" sw.js > site/sw.js
          grep -q "perok-${BUILD_ID}" site/sw.js
          # dist/ is produced here and never committed; test files and the
          # transport double have no business being online.
          rsync -a --exclude '*.test.js' --exclude '*.test.js.map' \
                   --exclude 'testing/' dist/ site/dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
